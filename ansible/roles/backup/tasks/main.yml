- name: Install cron + aws cli
  ansible.builtin.apt:
    name:
      - cron
      - awscli
    state: present
    update_cache: yes

- name: Create backup script
  ansible.builtin.copy:
    dest: /usr/local/bin/backup-db.sh
    mode: '0755'
    content: |
      #!/bin/bash
      set -e

      TIMESTAMP=$(date +%F-%H-%M)
      FILE="/tmp/app-db-$TIMESTAMP.sql.gz"

      pg_dump app | gzip > "$FILE"

      AWS_ACCESS_KEY_ID={{ aws_access_key }}
      AWS_SECRET_ACCESS_KEY={{ aws_secret_key }}

      aws s3 cp "$FILE" s3://{{ s3_bucket }}/backups/

      find /tmp -name "app-db-*.sql.gz" -mtime +180 -delete

- name: Ensure cron running
  ansible.builtin.service:
    name: cron
    state: started
    enabled: true

- name: Schedule hourly backup
  ansible.builtin.cron:
    name: "db backup"
    minute: "0"
    job: "/usr/local/bin/backup-db.sh"