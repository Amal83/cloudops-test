name: Ansible CI/CD

on:
  push:
    branches:
      - aq-test # only for my testing, remove later. everywhere "aq-test" should be replaced with "staging"
      - staging
      - main
  pull_request:

jobs:
  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/

  deploy:
    name: Deploy (staging/production)
    runs-on: ubuntu-latest
    needs: lint

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add host to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible deploy
        run: |
          ansible-playbook \
            -i ansible/inventories/${{ github.ref_name }}/hosts.yml \
            ansible/playbooks/deploy.yml \
            --private-key ~/.ssh/id_rsa

      - name: Database migration step (pseudo)
        run: echo "Running ORM migrations (Django/Rails placeholder)"